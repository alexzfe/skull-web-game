name = "skull"
main = "worker/index.js"
compatibility_date = "2026-10-12"
workers_dev = true
routes = [{ pattern = "skull.xlobax.com", custom_domain = true }]
assets = { directory = ".", binding = "ASSETS", run_worker_first = ["/api/*"] }

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBIES"
class_name = "LobbyDirectory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "LobbyDirectory"]

# Exposes the deployed version id; the worker serves it at /api/version and the
# rooms ask old clients (version skew after a deploy) to reload.
[version_metadata]
binding = "CF_VERSION_METADATA"
